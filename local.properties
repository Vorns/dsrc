# local.properties
# Local SWG Source build/settings overrides
# Keep build.properties clean so git updates do not conflict

# General:
# This handles if the database will be dropped or not. Turn this on if you want to drop the db and do a "ant drop_databse" from the swg-main dir.

firstrun = false

# SWG server settings:

cluster_name = swg

# Character Limits:

max_characters_per_account = 20
max_characters_per_cluster = 250
character_slots = 20

# Database Settings:

db_username = swg
db_password = swg
db_service = swg

# Git Branch Settings:

src_branch = master
dsrc_branch = master
serverdata_branch = master
configs_branch = master
stationapi_branch = master
swg_main_branch = master

# SRC Compilation

compiler = gcc
src_build_type = Release


